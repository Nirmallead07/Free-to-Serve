<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="Fr. Solomon Anthony Nirmalan, CMF">
<meta name="description" content="A private reflection on authority and community life for women and men religious and clergy.">
<meta property="og:type" content="website">
<meta property="og:title" content="Free to Serve">
<meta property="og:description" content="Is authority in your community lived as service? Can you speak freely? Take 15 quiet minutes to reflect. Completely private: your answers stay on your phone.">
<meta property="og:url" content="https://nirmallead07.github.io/Free-to-Serve/">
<meta property="og:image" content="https://nirmallead07.github.io/Free-to-Serve/preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Watercolour of a path over hills at dawn, with the words Free to Serve">
<meta name="twitter:card" content="summary_large_image">
<title>Free to Serve</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{
  --bg:#FAF0D2; --surface:#FFFAEB; --ink:#3A2A1D; --muted:#76604D;
  --line:#E6D3A8; --accent:#7A4A2B; --accent-soft:#F2E0BC; --gold:#A8732A;
  --display:"Spectral", Georgia, "Times New Roman", serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-top:calc(24px + env(safe-area-inset-top, 0px));padding-bottom:calc(48px + env(safe-area-inset-bottom, 0px))}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:2.1rem} h2{font-size:1.4rem} h3{font-size:1.1rem}
p{margin:0}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600}
.byline{font-size:.95rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px 20px;display:flex;flex-direction:column;gap:16px}
.card.soft{background:var(--accent-soft);border-color:var(--gold)}
.verse{font-family:var(--display);font-style:italic;font-size:1.1rem;color:var(--muted);border-left:2px solid var(--gold);padding-left:14px}
.verse cite{display:block;font-style:normal;font-size:.85rem;margin-top:4px;font-family:var(--body)}
.meta{color:var(--muted);font-size:.95rem}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--surface);border:0;border-radius:999px;padding:12px 22px;font-weight:600;align-self:flex-start}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:focus-visible,.opt:focus-visible,.link:focus-visible,.none-opt:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.link{background:none;border:0;color:var(--muted);padding:6px 0;text-decoration:underline}
.progress{display:flex;flex-direction:column;gap:8px}
.track{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.fill{height:100%;background:var(--accent);transition:width .35s ease}
.step{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);gap:8px}
.tag{color:var(--gold);font-weight:600}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:14px 16px;line-height:1.4;transition:border-color .2s,background .2s}
.opt:hover{border-color:var(--accent)}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opts.scale{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.scale .opt{text-align:center}
.none-opt{background:none;border:0;border-top:1px dashed var(--line);color:var(--muted);text-align:left;padding:12px 2px 2px;font-size:.95rem}
.none-opt.picked{color:var(--accent);font-weight:600}
.note{font-size:.88rem;color:var(--muted)}
.toast{font-size:.92rem;color:var(--accent)}
.pill{display:inline-block;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;align-self:flex-start}
.pill.gold{color:var(--gold)}
ul.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.areas{display:flex;flex-direction:column;gap:14px}
.arow{display:flex;flex-direction:column;gap:6px}
.ahead{display:flex;flex-direction:column;gap:0;font-size:.92rem}
.ahead b{font-family:var(--display);font-size:1.05rem;font-weight:600}
.ahead span{color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:#9BA97A}
.bar.some i{background:var(--gold)}
.bar.strong i{background:var(--accent)}
.legend{font-size:.85rem;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
label{font-weight:600;font-size:.95rem}
input[type=password],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--ink)}
.check{display:flex;gap:8px;align-items:center;font-weight:400}
.credit{max-width:560px;margin:32px auto 0;padding-top:16px;border-top:1px solid var(--line);text-align:center;font-size:.88rem;color:var(--muted)}
.credit b{font-family:var(--display);font-weight:600;color:var(--ink)}
.about{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 20px}
.about summary{cursor:pointer;padding:16px 0;font-family:var(--display);font-weight:600;font-size:1.1rem;list-style-position:inside}
.about .about-body{display:flex;flex-direction:column;gap:12px;padding-bottom:20px}
.about .dev-name{font-family:var(--display);font-weight:600;font-size:1.05rem}
.clear-card{background:transparent}
.scene{margin:-24px -20px 0;border-radius:14px 14px 0 0;overflow:hidden;line-height:0;border-bottom:1px solid var(--line)}
.scene svg{width:100%;height:auto;display:block}
.scene.photo img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.scene.photo.short img{aspect-ratio:16/6}
.motif{width:60px;height:60px;flex:none}
.chead{display:flex;align-items:center;gap:12px}
.big{font-size:1.25rem;font-weight:600;color:var(--accent)}
@media (prefers-reduced-motion: reduce){.fill,.opt{transition:none}}
</style>
</head>

<div class="wrap" id="app"></div>

// Watercolour and sketch art, drawn as inline SVG. Shared filters live in #artdefs.
const ARTDEFS = `<svg id="artdefs" width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
  <filter id="wc" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feGaussianBlur in="d" stdDeviation="1.1" result="b"/>
    <feComposite in="b" in2="d" operator="over"/>
  </filter>
  <filter id="wc2" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="14" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feGaussianBlur in="d" stdDeviation="2"/>

  <filter id="sk" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="turbulence" baseFrequency="0.9" numOctaves="1" seed="5" result="n"/>

const PAPER = `<rect width="320" height="180" fill="#FFF7E2"/><rect width="320" height="180" filter="url(#paper)" fill="#000"/>`;
const L = `fill="none" stroke="#5A4130" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#sk)"`;

const SCENES = {
  // Dawn path over hills, a bird in flight
  hero:`<svg viewBox="0 0 320 180" role="img" aria-label="Watercolour of a path over hills at dawn">${PAPER}
    <g filter="url(#wc2)"><rect x="-10" y="-10" width="340" height="120" fill="#F4D9A0" opacity=".55"/>
    <circle cx="228" cy="72" r="34" fill="#F2B95C" opacity=".55"/></g>
    <circle cx="228" cy="72" r="70" fill="url(#glow)" opacity=".7"/>
    <g filter="url(#wc)">

const SUPPORT_TEXT = "Thank you for answering honestly. What you are carrying sounds very heavy, and you do not have to carry it alone. Please reach out today to someone you trust, or call or text 1926, Sri Lanka's free and confidential National Mental Health Helpline, available day and night. You can also reach them on WhatsApp at 075 555 1926.";
const PDF_LINE = "Your perception is worth trusting. Speaking up is a sign of integrity, not illness. You deserve respect, freedom and support.";
const LOYAL_TEXT = "Love for our community can sometimes make difficulties hard to see or say. If some answers felt hard to give honestly, you are welcome to take this reflection again at a quieter time.";
const RIGHTS = [
  ["Abuse of authority is an offence in Church law.","Canon 1378 §1 of the revised Book VI (2021) provides for the punishment of anyone who abuses ecclesiastical power, office or function."],
  ["You may choose your confessor and spiritual director.","Canon 630 protects this freedom for religious."],
  ["Your good name and privacy are protected.","Canon 220 forbids harming a person's good reputation unlawfully or violating their privacy."],
  ["Psychological evaluation requires your free consent.","The Church's 2008 guidelines on the use of psychology in formation make consent a condition of psychological testing. The same principle applies to every adult."],
  ["You may seek recourse.","Decisions of a superior can be brought to a higher authority."]
];
const CONTACTS = [
  "A counsellor or spiritual director of your own choosing",
  "Your diocesan or congregational safeguarding delegate",
  "A trusted person outside your line of authority",
  "National Mental Health Helpline: call or text 1926 (free, confidential, day and night), or WhatsApp 075 555 1926"
];
const GENERAL_REFS = ["Ezekiel 34:1-16","Matthew 23:1-12","Psalm 34:18"];
const LEVEL_NAME = {healthy:"Healthy signs",some:"Some warning signs",strong:"Strong warning signs"};

// ---------- State (kept in memory only, never stored) ----------
const NS = SCEN.length, NT = STAT.length, NC = CLOSE.length, TOTAL = NS+NT+NC;
let sAns = new Array(NS).fill(null);   // 0..3 or "na"
let tAns = new Array(NT).fill(null);   // 0..3 or "skip"
let cAns = new Array(NC).fill(null);   // "yes" | "no" | "skip"
let i = 0;
const app = document.getElementById("app");
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]))}
function bar(pos){return `<div class="track"><div class="fill" style="width:${Math.round(pos/TOTAL*100)}%"></div></div>`}

// ---------- Screens ----------
function intro(msg){
  app.innerHTML = `
    ${msg?`<p class="toast" role="status">${esc(msg)}</p>`:""}
    <div class="card">
      ${scene("hero")}
      <span class="eyebrow">A reflection</span>
      <h1>Free to Serve</h1>
      <p class="byline">A reflection on authority and community life, by Fr. Solomon Anthony Nirmalan, CMF</p>
      <p>This reflection invites you to look honestly at how authority is lived in your community, diocese or congregation. There are no right or wrong answers. Answer from your own experience over the past year.</p>
      <p>Throughout, "superior" means whoever has authority over you: a local or provincial superior, a bishop, a rector, a formator or a parish priest.</p>
      <p>Your answers stay on this phone. Nothing is sent anywhere, and nothing is saved after you close this page. At the end you can save a copy of your results, or clear everything.</p>
      <p class="verse">You will know the truth, and the truth will make you free.<cite>John 8:32</cite></p>
      <p class="meta">Three parts · about 15 minutes · your answers stay on this phone</p>
      <button class="btn" id="start">Begin</button>
    </div>
    <p class="note">This is a reflection tool, not a diagnosis or a judgment on any person.</p>
    <details class="about">
      <summary>About this reflection</summary>
      <div class="about-body">
        <p>Free to Serve is a private reflection for women and men religious and clergy. It looks at ten areas of community life where authority can be lived as service or used as control: freedom to speak, how concerns are received, the use of spiritual authority, connection and outside support, respect and dignity, belonging and approval, personal freedom and care, freedom to discern your path, how this affects you, and honest and fair decisions.</p>
        <p>Part One presents ten situations and asks what would most likely happen in your community. Part Two has short statements about your present community or diocese. A short closing check asks five yes or no questions.</p>
        <p>The reflection draws on behavioural research on coercive control, abusive supervision, destructive leadership, institutional betrayal and spiritual abuse. It is not a validated measurement instrument, and its results should not be used to evaluate any person or community.</p>
        <p>Nothing is sent anywhere and nothing is stored on the phone. If you choose to save a PDF, it is created on your own phone.</p>
      </div>
    </details>
    <details class="about">
      <summary>About the developer</summary>
      <div class="about-body">
        <p class="dev-name">Fr. Solomon Anthony Nirmalan, CMF</p>
        <p>Fr. Solomon is a Claretian Missionary priest with 15 years of ministry and a behavioural researcher. He is pursuing a Master of Arts in Behavioural Sciences, Track in Organizational and Social Systems Development, at De La Salle University. He holds bachelor's degrees in Philosophy and Theology from the National Seminary of Sri Lanka, affiliated with the Pontifical Urbaniana University in Rome.</p>
        <p>His research asks how leaders shape the communities they serve. His thesis focuses on transformative leadership, built on stewardship, integrity, moral purpose and lasting good. He is also studying the wellbeing of priests and religious, including how clergy and religious in Sri Lanka view psychological help and counselling.</p>
        <p>He brings research and ministry together in practical tools for religious life. Living My Vows helps sisters reflect on their vows. Quieting the Mind looks at overthinking. Free to Serve looks at how authority is lived in community. Each tool draws on several behavioural frameworks and turns research into a private, simple reflection.</p>
        <p>His wider interests include organizational culture, social and institutional change, community development and social justice for marginalized communities. He is fluent in Tamil, Sinhala and English.</p>
      </div>
    </details>`;
  document.getElementById("start").onclick=()=>partIntro(1);
  window.scrollTo(0,0);
}

function partIntro(p){
  const info = {
    1:{t:"What would most likely happen?",b:`You will read ${NS} situations. Choose what would <b>most likely happen in your community</b>, not what should happen. If a situation does not fit your life, choose "This does not apply to me."`,pos:0,go:()=>{i=0;scen();},back:()=>intro()},
    2:{t:"How often is this true?",b:`You will read ${NT} short statements. Think of your present community or diocese, and answer how often each one is true for you. You may skip any statement.`,pos:NS,go:()=>{i=0;stat();},back:()=>{i=NS-1;scen();}},
    3:{t:"A closing check",b:"Five last questions, answered yes or no. You may skip any of them. These help make sure that nothing important is lost in the totals.",pos:NS+NT,go:()=>{i=0;closing();},back:()=>{i=NT-1;stat();}}
  }[p];
  app.innerHTML = `
    <div class="progress"><div class="step"><span class="tag">Part ${p===3?"Three":p===2?"Two":"One"}</span><span></span></div>${bar(info.pos)}</div>
    <div class="card">
      ${scene("part"+p)}
      <span class="eyebrow">Part ${p===3?"Three":p===2?"Two":"One"}</span>
      <h1>${info.t}</h1>
      <p>${info.b}</p>
      <button class="btn" id="go">Continue</button>
    </div>
    <div class="row"><button class="link" id="back">Back</button></div>`;
  document.getElementById("go").onclick=info.go;
  document.getElementById("back").onclick=info.back;
  window.scrollTo(0,0);
}

function pick(arr,idx,val,after,el){
  arr[idx]=val;
  app.querySelectorAll(".opt,.none-opt").forEach(x=>x.classList.remove("picked"));
  el.classList.add("picked");
  setTimeout(after,220);
}

function scen(){
  const it=SCEN[i];
  app.innerHTML = `
    <div class="progress"><div class="step"><span class="tag">${esc(AREAS[it.a].name)}</span><span>Part One · ${i+1} of ${NS}</span></div>${bar(i)}</div>
    <div class="card">
      ${photo("s"+(i+1))}
      <span class="eyebrow">${esc(it.t)}</span>
      <h2>${esc(it.q)}</h2>
      <div class="opts">${it.o.map((o,k)=>`<button class="opt${sAns[i]===k?" picked":""}" data-k="${k}">${esc(o)}</button>`).join("")}</div>
      <button class="none-opt${sAns[i]==="na"?" picked":""}" id="na">This does not apply to me</button>
    </div>
    <div class="row"><button class="link" id="back">Back</button></div>`;
  const nx=()=>{ if(i<NS-1){i++;scen();} else partIntro(2); };
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(sAns,i,+b.dataset.k,nx,b));
  document.getElementById("na").onclick=e=>pick(sAns,i,"na",nx,e.currentTarget);
  document.getElementById("back").onclick=()=>{ if(i>0){i--;scen();} else partIntro(1); };
  window.scrollTo(0,0);
}

function stat(){
  const it=STAT[i];
  const tag = it.loyal ? "A quiet check" : AREAS[it.a].name;
  app.innerHTML = `
    <div class="progress"><div class="step"><span class="tag">${esc(tag)}</span><span>Part Two · ${i+1} of ${NT}</span></div>${bar(NS+i)}</div>
    <div class="card">
      ${it.loyal?"":photo(AREA_IMG[it.a],true)}
      <p class="note">In my present community or diocese...</p>
      <h2>${esc(it.q)}</h2>
      <div class="opts scale">${FREQ.map((l,k)=>`<button class="opt${tAns[i]===k?" picked":""}" data-k="${k}">${l}</button>`).join("")}</div>
      <button class="none-opt${tAns[i]==="skip"?" picked":""}" id="skip">Skip this one</button>
    </div>
    <div class="row"><button class="link" id="back">Back</button></div>`;
  const nx=()=>{ if(i<NT-1){i++;stat();} else partIntro(3); };
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(tAns,i,+b.dataset.k,nx,b));
  document.getElementById("skip").onclick=e=>pick(tAns,i,"skip",nx,e.currentTarget);
  document.getElementById("back").onclick=()=>{ if(i>0){i--;stat();} else partIntro(2); };
  window.scrollTo(0,0);
}

function closing(){
  app.innerHTML = `
    <div class="progress"><div class="step"><span class="tag">Closing check</span><span>${i+1} of ${NC}</span></div>${bar(NS+NT+i)}</div>
    <div class="card">
      <h2>${esc(CLOSE[i])}</h2>
      <div class="opts scale">${["Yes","No"].map(l=>`<button class="opt${cAns[i]===l.toLowerCase()?" picked":""}" data-k="${l.toLowerCase()}">${l}</button>`).join("")}</div>
      <button class="none-opt${cAns[i]==="skip"?" picked":""}" id="skip">I prefer not to answer</button>
    </div>
    <div class="row"><button class="link" id="back">Back</button></div>`;
  const nx=()=>{ if(i<NC-1){i++;closing();} else result(); };
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(cAns,i,b.dataset.k,nx,b));
  document.getElementById("skip").onclick=e=>pick(cAns,i,"skip",nx,e.currentTarget);
  document.getElementById("back").onclick=()=>{ if(i>0){i--;closing();} else partIntro(3); };
  window.scrollTo(0,0);
}

// ---------- Scoring ----------
function levelOf(r){ return r===null?null : r<0.34?"healthy" : r<0.60?"some" : "strong"; }

function compute(){
  const area={};
  ORDER.forEach(a=>{
    let sum=0,max=0;
    SCEN.forEach((s,k)=>{ if(s.a===a && typeof sAns[k]==="number"){sum+=sAns[k];max+=3;} });
    STAT.forEach((s,k)=>{ if(s.a===a && typeof tAns[k]==="number"){sum+= s.r?3-tAns[k]:tAns[k]; max+=3;} });
    const r = max? sum/max : null;
    area[a]={r,level:levelOf(r)};
  });
  const scored=ORDER.filter(a=>area[a].r!==null);
  const nStrong=scored.filter(a=>area[a].level==="strong").length;
  const closeYes=[0,1,2,3].filter(k=>cAns[k]==="yes");
  const crisis = cAns[4]==="yes";
  const mean = scored.length? scored.reduce((t,a)=>t+area[a].r,0)/scored.length : null;
  let overall;
  if(closeYes.length || area.B.level==="strong" || nStrong>=3) overall="strong";
  else overall = levelOf(mean) || "healthy";
  const loyalIdx=STAT.map((s,k)=>s.loyal?k:-1).filter(k=>k>=0);
  const loyal = loyalIdx.every(k=>tAns[k]===2||tAns[k]===3);
  return {area,scored,overall,closeYes,crisis,loyal};
}

// ---------- Results ----------
let last=null;
function result(){
  const R = compute(); last=R;
  const flagged = R.scored.filter(a=>R.area[a].level!=="healthy").sort((x,y)=>R.area[y].r-R.area[x].r);
  const healthy = R.scored.filter(a=>R.area[a].level==="healthy");
  const showRights = R.overall==="strong" || flagged.length>0;
  const M = MSG[R.overall];

  const crisisCard = R.crisis ? `
    <div class="card soft" role="alert">
      ${scene("support")}
      <span class="pill gold">Before anything else</span>
      <h2>You do not have to carry this alone</h2>
      <p>${esc(SUPPORT_TEXT)}</p>
      <p class="big">Call or text 1926</p>
    </div>` : "";

  const areaRows = ORDER.map(a=>{
    const A=R.area[a];
    if(A.r===null) return `<div class="arow"><div class="ahead"><b>${esc(AREAS[a].name)}</b><span>Not enough answers</span></div></div>`;
    return `<div class="arow"><div class="ahead"><b>${esc(AREAS[a].name)}</b><span>${LEVEL_NAME[A.level]}</span></div>
      <div class="bar ${A.level}"><i style="width:${Math.max(4,Math.round(A.r*100))}%"></i></div></div>`;
  }).join("");

  const flaggedCards = flagged.map(a=>{
    const X=AREAS[a], L=R.area[a].level;
    return `<div class="card">
      <div class="chead">${icon(a)}<div class="field"><span class="pill${L==="strong"?"":" gold"}">${LEVEL_NAME[L]}</span>
      <h2>${esc(X.name)}</h2></div></div>
      <p>${esc(X.warn)}</p>
      <h3>A question to sit with</h3>
      <p>${esc(X.reflect)}</p>
      <h3>Small steps</h3>
      <ul class="plain">${X.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>
    </div>`;
  }).join("");

  const healthyCard = healthy.length ? `
    <div class="card">
      <span class="pill">What is healthy</span>
      <h2>Gifts to protect</h2>
      <ul class="plain">${healthy.map(a=>`<li><b>${esc(AREAS[a].name)}.</b> ${esc(AREAS[a].healthy)}</li>`).join("")}</ul>
    </div>` : "";

  const loyalCard = R.loyal ? `
    <div class="card"><span class="pill gold">A gentle word</span><p>${esc(LOYAL_TEXT)}</p></div>` : "";

  const rightsCard = showRights ? `
    <div class="card">
      <span class="eyebrow">Knowing your rights</span>
      <h2>What the Church protects</h2>
      <ul class="plain">${RIGHTS.map(r=>`<li><b>${esc(r[0])}</b> ${esc(r[1])}</li>`).join("")}</ul>
    </div>` : "";

  const refs = flagged.length ? flagged.map(a=>[AREAS[a].name,AREAS[a].ref]) : [];
  const scriptureCard = `
    <details class="about">
      <summary>Scripture for prayer (optional)</summary>
      <div class="about-body">
        <p class="note">Read these in your own Bible, if it helps you.</p>
        <ul class="plain">${refs.map(r=>`<li>${esc(r[1])} <span class="note">(${esc(r[0])})</span></li>`).join("")}${GENERAL_REFS.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>
      </div>
    </details>`;

  app.innerHTML = `
    ${crisisCard}
    <div class="card">
      ${scene("result")}
      <span class="eyebrow">Your reflection</span>
      <h1>${esc(M.title)}</h1>
      <p>${esc(M.text)}</p>
      <p class="note">Read this slowly. It is not a judgment on you or on any person. It is a light on how authority is being lived around you today.</p>
    </div>
    <div class="card">
      <span class="eyebrow">The ten areas</span>
      <p class="legend">A longer bar means more warning signs in that area.</p>
      <div class="areas">${areaRows}</div>
    </div>
    ${loyalCard}
    ${flaggedCards}
    ${healthyCard}
    ${rightsCard}
    <div class="card">
      ${R.crisis?"":scene("support")}
      <span class="eyebrow">Where to find support</span>
      <ul class="plain">${CONTACTS.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>
    </div>
    ${scriptureCard}
    <div class="card" id="pdfcard">
      <span class="eyebrow">Keep a copy</span>
      <h2>Save my results as a PDF</h2>
      <p>The file is made on this phone and saved to your downloads. It is called "Reflection Notes" with today's date.</p>
      <p><b>Save this only if your phone is private to you.</b></p>
      <label class="check"><input type="checkbox" id="usepw"> Protect the file with a password</label>
      <div class="field" id="pwbox" hidden>
        <label for="pw">Password</label>
        <input type="password" id="pw" autocomplete="new-password">
        <label class="check"><input type="checkbox" id="showpw"> Show password</label>
        <p class="note">Remember it. If it is forgotten, the file cannot be opened.</p>
      </div>
      <button class="btn" id="savepdf">Save PDF</button>
      <p class="toast" id="pdfmsg" hidden></p>
      <p class="note">If nothing happens, open this page in Chrome or Safari rather than inside a messaging app.</p>
    </div>
    <div class="row"><button class="btn ghost" id="again">Begin again</button><button class="link" id="review">Review my answers</button></div>
    <div class="card clear-card">
      <h3>When you have finished</h3>
      <p class="note">Clear your answers before you close this page, especially if others may use this phone.</p>
      <button class="btn ghost" id="clear">Clear my answers</button>
    </div>`;

  const usepw=document.getElementById("usepw"), pwbox=document.getElementById("pwbox"), pw=document.getElementById("pw");
  usepw.onchange=()=>{pwbox.hidden=!usepw.checked; if(usepw.checked) pw.focus();};
  document.getElementById("showpw").onchange=e=>{pw.type=e.target.checked?"text":"password";};
  document.getElementById("savepdf").onclick=()=>{
    const msg=document.getElementById("pdfmsg"); msg.hidden=false;
    if(usepw.checked && !pw.value){msg.textContent="Please type a password, or untick the box.";return;}
    try{ makePDF(R, usepw.checked?pw.value:null); msg.textContent="Your PDF has been created. Check your downloads."; }
    catch(e){ msg.textContent="Sorry, the PDF could not be made on this browser. Please try Chrome or Safari."; }
  };
  const reset=()=>{sAns.fill(null);tAns.fill(null);cAns.fill(null);i=0;last=null;};
  document.getElementById("again").onclick=()=>{reset();intro();};
  document.getElementById("review").onclick=()=>{i=0;scen();};
  document.getElementById("clear").onclick=()=>{reset();intro("Your answers have been cleared.");};
  window.scrollTo(0,0);
}

// ---------- PDF ----------
function plain(s){return String(s).replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,"-").replace(/§/g,"Sec.")}
function makePDF(R, password){
  const { jsPDF } = window.jspdf;
  const opts={unit:"mm",format:"a4"};
  if(password) opts.encryption={userPassword:password,ownerPassword:password,userPermissions:["print","copy"]};
  const doc=new jsPDF(opts);
  const W=210, M=18, CW=W-2*M; let y=22;
  const ink=[58,42,29], muted=[118,96,77], brown=[122,74,43];
  function room(h){ if(y+h>282){doc.addPage();y=20;} }
  function text(s,{size=11,style="normal",color=ink,gap=2,indent=0}={}){
    doc.setFont("helvetica",style); doc.setFontSize(size); doc.setTextColor(...color);
    const lines=doc.splitTextToSize(plain(s),CW-indent); const lh=size*0.42;
    lines.forEach(l=>{room(lh);doc.text(l,M+indent,y);y+=lh;}); y+=gap;
  }
  function bullet(s){ room(5); doc.setFont("helvetica","normal");doc.setFontSize(11);doc.setTextColor(...ink); doc.text("-",M+1,y); text(s,{indent:5,gap:1}); }
  function head(s){ y+=2; room(10); text(s,{size:13,style:"bold",color:brown,gap:2}); }

  const now=new Date();
  const ds=now.getDate()+" "+now.toLocaleString("en-GB",{month:"short"})+" "+now.getFullYear();
  text("Reflection Notes",{size:20,style:"bold",color:brown,gap:1});
  text(ds,{size:10,color:muted,gap:5});
  text(PDF_LINE,{size:12,style:"italic",gap:6});

  if(R.crisis){ head("Support for you"); text(SUPPORT_TEXT); }
  head(MSG[R.overall].title); text(MSG[R.overall].text);

  head("The ten areas");
  ORDER.forEach(a=>{ const A=R.area[a]; text(AREAS[a].name+":  "+(A.r===null?"Not enough answers":LEVEL_NAME[A.level]),{gap:1}); });
  y+=2;

  if(R.closeYes.length){
    head("From the closing check");
    text("You answered yes to:",{gap:1});
    R.closeYes.forEach(k=>bullet(CLOSE[k]));
  }
  if(R.loyal){ head("A gentle word"); text(LOYAL_TEXT); }

  const flagged=R.scored.filter(a=>R.area[a].level!=="healthy").sort((x,y2)=>R.area[y2].r-R.area[x].r);
  flagged.forEach(a=>{
    const X=AREAS[a];
    head(X.name+" ("+LEVEL_NAME[R.area[a].level]+")");
    text(X.warn);
    text("A question to sit with: "+X.reflect,{style:"italic"});
    X.steps.forEach(s=>bullet(s)); y+=2;
  });
  const healthy=R.scored.filter(a=>R.area[a].level==="healthy");
  if(healthy.length){ head("What is healthy"); healthy.forEach(a=>bullet(AREAS[a].name+". "+AREAS[a].healthy)); }

  if(R.overall==="strong"||flagged.length){ head("Knowing your rights"); RIGHTS.forEach(r=>bullet(r[0]+" "+r[1])); }
  head("Where to find support"); CONTACTS.forEach(c=>bullet(c));
  head("Scripture for prayer (optional)");
  text(flagged.map(a=>AREAS[a].ref).concat(GENERAL_REFS).join("; "));
  y+=4;
  text("This is a reflection tool, not a diagnosis or a judgment on any person. Prepared by Fr. Solomon Anthony Nirmalan, CMF.",{size:9,color:muted});

  doc.save("Reflection-Notes-"+ds.replace(/ /g,"-")+".pdf");
}

intro();
</script>
